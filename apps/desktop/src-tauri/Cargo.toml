[package]
name = "omniterm-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version = "1.95"
description = "Thin native host for the Omniterm workspace prototype"
default-run = "omniterm-desktop"
license = "MIT"

[lib]
name = "omniterm_desktop"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
omniterm-core = { path = "../../../crates/omniterm-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "=2.12.5", features = [] }
portable-pty = "=0.9.0"
vt100 = { version = "=0.18.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
