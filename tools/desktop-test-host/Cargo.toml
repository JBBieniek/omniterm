[package]
name = "omniterm-test-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version = "1.95"
description = "Private Windows automation host for the real Omniterm app"
license = "MIT"

[target.'cfg(windows)'.dependencies]
omniterm-desktop = { path = "../../apps/desktop/src-tauri" }
omniterm-core = { path = "../../crates/omniterm-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "=2.12.5", features = [] }
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }
